<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINCOMETRIC — Radial Mind Map</title>

<style>
  :root {
    --green-dark: #0b3025;
    --green: #176b4b;
    --green-mid: #299d71;
    --green-light: #65c9a0;
    --green-pale: #b3e7d0;

    --text: #172b24;
    --muted: #60746b;
    --light: #f0f4f1;
    --border: #d8e2dc;
    --dark: #09251d;
    --dark-panel: #10382b;

    --max-width: 1180px;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--dark);
    color: var(--light);
  }

  #cincometric-map {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 280px;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 48%, var(--dark-panel) 0%, var(--dark) 70%);
  }

  #mm-svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .mm-link {
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .mm-node {
    pointer-events: none;
  }

  .mm-node rect.mm-card {
    stroke-width: 1.6;
    vector-effect: non-scaling-stroke;
  }

  .mm-node text {
    font-size: 13px;
    fill: var(--light);
    dominant-baseline: middle;
    pointer-events: none;
  }

  .mm-node .mm-label {
    font-size: 13px;
  }

  .mm-node.root rect.mm-card {
    stroke-width: 2.5;
  }

  .mm-node.root .mm-label {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .03em;
  }

  .mm-sprite {
    pointer-events: none;
  }

  @media (max-width: 600px) {
    .mm-node .mm-label { font-size: 12px; }
    .mm-node.root .mm-label { font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mm-link, .mm-node { transition: none; }
  }
</style>
</head>

<body>

<div id="cincometric-map">
  <svg id="mm-svg" role="img"
       aria-label="CINCOMETRIC animated project structure">

    <defs>
      <g id="icon-portfolio" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#7c4dff"/>
        <rect x="28" y="28" width="18" height="18" rx="4" fill="none" stroke="#fff" stroke-width="6"/>
        <rect x="54" y="28" width="18" height="18" rx="4" fill="none" stroke="#fff" stroke-width="6"/>
        <rect x="28" y="54" width="18" height="18" rx="4" fill="none" stroke="#fff" stroke-width="6"/>
        <rect x="54" y="54" width="18" height="18" rx="4" fill="none" stroke="#fff" stroke-width="6"/>
      </g>
      <g id="icon-moc" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#9162ff"/>
        <line x1="38" y1="52" x2="38" y2="72" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="38" cy="46" r="6" fill="none" stroke="#fff" stroke-width="6"/>
        <path d="M38 58 Q58 58 58 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="58" cy="70" r="6" fill="none" stroke="#fff" stroke-width="6"/>
      </g>
      <g id="icon-stagegate" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#0f9d58"/>
        <line x1="50" y1="28" x2="50" y2="72" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <path d="M26 38 H64 L74 48 L64 58 H26 Z" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="icon-planning" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#009688"/>
        <rect x="25" y="35" width="50" height="40" rx="5" fill="none" stroke="#fff" stroke-width="6"/>
        <line x1="25" y1="50" x2="75" y2="50" stroke="#fff" stroke-width="6"/>
        <line x1="38" y1="25" x2="38" y2="35" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <line x1="62" y1="25" x2="62" y2="35" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="40" cy="62" r="4" fill="#fff"/><circle cx="60" cy="62" r="4" fill="#fff"/>
      </g>
      <g id="icon-estimating" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#2962ff"/>
        <rect x="28" y="25" width="44" height="50" rx="6" fill="none" stroke="#fff" stroke-width="6"/>
        <rect x="36" y="33" width="28" height="12" rx="2" fill="none" stroke="#fff" stroke-width="4"/>
        <circle cx="41" cy="54" r="3" fill="#fff"/><circle cx="59" cy="54" r="3" fill="#fff"/>
        <circle cx="41" cy="66" r="3" fill="#fff"/><circle cx="59" cy="66" r="3" fill="#fff"/>
      </g>
      <g id="icon-controls" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#0288d1"/>
        <rect x="26" y="58" width="6" height="16" rx="1.5" fill="#fff" opacity=".6"/>
        <rect x="38" y="48" width="6" height="26" rx="1.5" fill="#fff" opacity=".6"/>
        <rect x="50" y="42" width="6" height="32" rx="1.5" fill="#fff" opacity=".6"/>
        <rect x="62" y="36" width="6" height="38" rx="1.5" fill="#fff" opacity=".6"/>
        <rect x="74" y="28" width="6" height="46" rx="1.5" fill="#fff" opacity=".6"/>
        <path d="M22 54 L32 44 L44 38 L56 32 L68 24 L80 18" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="icon-resources" transform="scale(0.25)">
        <rect width="100" height="100" rx="24" fill="#c58000"/>
        <circle cx="44" cy="40" r="10" fill="none" stroke="#fff" stroke-width="6"/>
        <path d="M24 73 A20 20 0 0 1 64 73" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="66" cy="46" r="7" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M54 73 A14 14 0 0 1 78 73" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </g>
    </defs>

    <g id="mm-viewport-links"></g>
    <g id="mm-viewport-nodes"></g>
  </svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<script>
(() => {
  "use strict";

  const CONFIG = {
    animationMode: 1,
    intervalSeconds: 1.2,
    transitionMs: 650,
    fullMapPauseSeconds: 2.5,
    resetPauseSeconds: 1.2,
    nodeFillMode: "transparent",
    radiusStep: 125,
    fitPadding: 0.88,
    minNodeWidth: 90,
    maxNodeWidth: 220,
    nodeHeight: 38,
    rootWidth: 190,
    rootHeight: 54,
    sprites: {
      "Portfolio": "#icon-portfolio",
      "Change (MOC)": "#icon-moc",
      "Stage-Gate": "#icon-stagegate",
      "Planning & Risk": "#icon-planning",
      "Estimating": "#icon-estimating",
      "Project Controls": "#icon-controls",
      "Resources": "#icon-resources"
    },
    projectStructure: {
      name: "CINCOMETRIC",
      children: [
        {
          name: "Portfolio",
          children: [
            { name: "Overview" },
            { name: "Throughput" }
          ]
        },
        {
          name: "Change (MOC)",
          children: [
            { name: "Approvals" },
            { name: "Advice" },
            { name: "Actions" }
          ]
        },
        {
          name: "Stage-Gate",
          children: [
            { name: "FEL Gates" },
            { name: "Deliverables" }
          ]
        },
        {
          name: "Planning & Risk",
          children: [
            { name: "Schedules" },
            { name: "Gantt" },
            { name: "Risks" },
            { name: "HSE" }
          ]
        },
        {
          name: "Estimating",
          children: [
            { name: "Estimates" },
            { name: "Analytics" }
          ]
        },
        {
          name: "Project Controls",
          children: [
            { name: "Changes" },
            { name: "Cash Flow" },
            { name: "Forecasts" },
            { name: "Packages" }
          ]
        },
        {
          name: "Resources",
          children: [
            { name: "Disciplines" },
            { name: "Capacity" },
            { name: "Allocation" },
            { name: "Timesheets" }
          ]
        }
      ]
    }
  };

  const COLORS = Array.of("#299d71", "#65c9a0", "#176b4b", "#b3e7d0", "#60746b");

  const canvas = document.getElementById("cincometric-map");
  const svg = d3.select("#mm-svg");
  const viewportLinks = svg.select("#mm-viewport-links");
  const viewportNodes = svg.select("#mm-viewport-nodes");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  const transitionDuration = reduceMotion.matches ? 0 : Math.max(0, CONFIG.transitionMs);

  let rootData, root, timer = null, animationToken = 0, destroyed = false, resizeFrame = null;
  const expandedIds = new Set();
  const nodeIndex = new Map();

  function prepareData(node, parentId = "", depth = 0, index = 0) {
    node.id = parentId ? parentId + "-" + index : "root";
    node.depth = depth;

    if (depth === 0) {
      node.branchColor = "#176b4b";
    } else if (depth === 1) {
      node.branchColor = COLORS.at(index % COLORS.length);
    }

    nodeIndex.set(node.id, node);

    (node.children || []).forEach((child, i) => {
      if (depth > 0) child.branchColor = node.branchColor;
      prepareData(child, node.id, depth + 1, i);
    });

    return node;
  }

  rootData = prepareData(JSON.parse(JSON.stringify(CONFIG.projectStructure)));

  function nodeWidth(d) {
    if (d.depth === 0) return CONFIG.rootWidth;
    return Math.max(CONFIG.minNodeWidth, Math.min(CONFIG.maxNodeWidth, d.data.name.length * 7.1 + 48));
  }

  function nodeHeight(d) {
    return d.depth === 0 ? CONFIG.rootHeight : CONFIG.nodeHeight;
  }

  function radialPoint(angle, radius) {
    return {
      x: radius * Math.cos(angle - Math.PI / 2),
      y: radius * Math.sin(angle - Math.PI / 2)
    };
  }

  function branchColor(d) {
    return d.data.branchColor || "#176b4b";
  }

  function buildVisibleHierarchy() {
    return d3.hierarchy(rootData, d => expandedIds.has(d.id) && d.children && d.children.length ? d.children : null);
  }

  function calculateLayout() {
    const width = canvas.clientWidth, height = canvas.clientHeight;
    svg.attr("viewBox", `0 0 ${width} ${height}`);

    root = buildVisibleHierarchy();
    const visible = root.descendants();
    const maxDepth = d3.max(visible, d => d.depth) || 1;
    const availableRadius = Math.min(width, height) * 0.42;
    const radiusStep = Math.min(CONFIG.radiusStep, Math.max(52, availableRadius / Math.max(1, maxDepth)));

    const layout = d3.tree()
      .size([2 * Math.PI, radiusStep * maxDepth])
      .separation((a, b) => ((a.parent === b.parent ? 1.2 : 1.7) * Math.max(1, (nodeWidth(a) + nodeWidth(b)) / 250)) / Math.max(1, a.depth));

    layout(root);
    const cx = width / 2, cy = height / 2;

    root.each(d => {
      const p = radialPoint(d.x, d.y);
      d.px = cx + p.x;
      d.py = cy + p.y;
    });

    return { width, height, cx, cy, visible };
  }

  function linkPath(d) {
    const s = d.source, t = d.target;
    const sourceAngle = s.depth === 0 ? t.x : s.x;
    const delta = t.y - s.y;
    const p1 = radialPoint(sourceAngle, s.y + delta * 0.42);
    const p2 = radialPoint(t.x, s.y + delta * 0.78);
    const cx = canvas.clientWidth / 2, cy = canvas.clientHeight / 2;

    return `M${s.px},${s.py} C${cx + p1.x},${cy + p1.y} ${cx + p2.x},${cy + p2.y} ${t.px},${t.py}`;
  }

  function nodeFill(d, color) {
    return d.depth === 0 ? "#0b3025" : (CONFIG.nodeFillMode === "opaque" ? color : "#10382b");
  }

  function render(animate = true) {
    if (destroyed) return;
    const { visible, cx, cy } = calculateLayout();
    const duration = animate ? transitionDuration : 0;

    const linkSelection = viewportLinks.selectAll("path.mm-link").data(root.links(), d => d.target.data.id);
    linkSelection.exit().interrupt().transition().duration(duration).attr("opacity", 0).remove();
    
    const linkEnter = linkSelection.enter().append("path").attr("class", "mm-link").attr("stroke", d => branchColor(d.target)).attr("opacity", 0).attr("d", d => `M${d.source.px},${d.source.py} L${d.source.px},${d.source.py}`);
    linkEnter.merge(linkSelection).interrupt().attr("stroke", d => branchColor(d.target)).transition().duration(duration).attr("d", linkPath).attr("opacity", 0.88);

    const nodeSelection = viewportNodes.selectAll("g.mm-node").data(visible, d => d.data.id);
    nodeSelection.exit().interrupt().transition().duration(duration).attr("opacity", 0).remove();

    const nodeEnter = nodeSelection.enter().append("g").attr("class", "mm-node").attr("opacity", 0).attr("transform", d => `translate(${(d.parent || d).px || cx}, ${(d.parent || d).py || cy}) scale(.88)`);
    nodeEnter.append("rect").attr("class", "mm-card").attr("rx", 17).attr("ry", 17);
    nodeEnter.append("use").attr("class", "mm-sprite").attr("width", 25).attr("height", 25);
    nodeEnter.append("text").attr("class", "mm-label");

    const merged = nodeEnter.merge(nodeSelection);
    merged.each(function(d) {
      const g = d3.select(this), w = nodeWidth(d), h = nodeHeight(d), color = branchColor(d), isRoot = d.depth === 0, hasSprite = d.depth === 1 && Reflect.get(CONFIG.sprites, d.data.name);
      g.select("rect.mm-card").attr("x", -w / 2).attr("y", -h / 2).attr("width", w).attr("height", h).attr("fill", nodeFill(d, color)).attr("stroke", isRoot ? "#65c9a0" : color);
      g.select(".mm-sprite").attr("x", -w / 2 + 8).attr("y", -12).attr("href", Reflect.get(CONFIG.sprites, d.data.name) || "").attr("opacity", hasSprite ? 1 : 0);
      g.select(".mm-label").attr("x", isRoot ? 0 : -w / 2 + (hasSprite ? 40 : 14)).attr("y", 1).attr("text-anchor", isRoot ? "middle" : "start")
       .style("font-weight", isRoot ? 800 : 500).style("font-size", isRoot ? "16px" : "13px").text(d.data.name);
    });

    merged.interrupt().transition().duration(duration).attr("transform", d => `translate(${d.px},${d.py}) scale(1)`).attr("opacity", 1);
  }

  function waitSeconds(seconds, token) {
    return new Promise(res => { if (token !== animationToken || destroyed) return res(false); timer = setTimeout(() => { timer = null; res(token === animationToken && !destroyed); }, seconds * 1000); });
  }

  const valid = token => token === animationToken && !destroyed;
  const expandNode = d => { expandedIds.add(d.data.id); render(true); };
  const collapseEverything = () => { expandedIds.clear(); render(true); };
  const hiddenChildCandidates = () => root.descendants().filter(d => d.data.children && d.data.children.length && !expandedIds.has(d.data.id));
  const resetCycle = async token => { if (!valid(token)) return false; collapseEverything(); return waitSeconds(CONFIG.resetPauseSeconds, token); };

  async function runRandomMode(token) {
    while (valid(token)) {
      collapseEverything();
      if (!await waitSeconds(CONFIG.resetPauseSeconds, token)) return;
      expandNode(root);
      if (!await waitSeconds(CONFIG.intervalSeconds, token)) return;
      while (valid(token)) {
        const candidates = hiddenChildCandidates();
        if (!candidates.length) break;
        expandNode(candidates.at(Math.floor(Math.random() * candidates.length)));
        if (!await waitSeconds(CONFIG.intervalSeconds, token)) return;
      }
      if (!await waitSeconds(CONFIG.fullMapPauseSeconds, token) || !await resetCycle(token)) return;
    }
  }

  async function runLevelMode(token) {
    while (valid(token)) {
      collapseEverything();
      if (!await waitSeconds(CONFIG.resetPauseSeconds, token)) return;
      expandNode(root);
      if (!await waitSeconds(CONFIG.intervalSeconds, token)) return;
      let level = 1;
      while (valid(token)) {
        const candidates = root.descendants().filter(d => d.depth === level && d.data.children && d.data.children.length && !expandedIds.has(d.data.id));
        if (!candidates.length) break;
        candidates.forEach(expandNode);
        if (!await waitSeconds(CONFIG.intervalSeconds, token)) return;
        level++;
      }
      if (!await waitSeconds(CONFIG.fullMapPauseSeconds, token) || !await resetCycle(token)) return;
    }
  }

  function startAnimation() {
    animationToken++;
    const token = animationToken;
    if (timer !== null) { clearTimeout(timer); timer = null; }
    viewportLinks.selectAll("*").interrupt();
    viewportNodes.selectAll("*").interrupt();
    expandedIds.clear();

    if (CONFIG.animationMode === 3) {
      expandedIds.clear();
      nodeIndex.forEach(n => { if (n.children && n.children.length) expandedIds.add(n.id); });
      render(false);
      return;
    }
    render(false);
    if (CONFIG.animationMode === 1) runRandomMode(token);
    else if (CONFIG.animationMode === 2) runLevelMode(token);
  }

  window.addEventListener("resize", () => {
    if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => { resizeFrame = null; render(false); });
  });

  window.CincometricMindMap = {
    config: CONFIG,
    restart() { startAnimation(); },
    setAnimationMode(m) { if (Array.of(1, 2, 3).includes(m)) { CONFIG.animationMode = m; startAnimation(); } },
    setNodeFillMode(m) { if (Array.of("transparent", "opaque").includes(m)) { CONFIG.nodeFillMode = m; render(false); } },
    destroy() { destroyed = true; animationToken++; if (timer !== null) clearTimeout(timer); viewportLinks.selectAll("*").interrupt(); viewportNodes.selectAll("*").interrupt(); }
  };

  startAnimation();
})();
</script>
</body>
</html>
